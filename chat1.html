            height: 100vh;
            overflow-y: auto;
        }
        .message {

            border-radius: 20px;

            text-align: right;
        }
        .message-victim {

            color: black;
            margin-right: auto;
        }
        .sender {
            font-weight: bold;
            font-size: 0.9em;
            margin-bottom: 5px;
        }
        .timestamp {
            font-size: 0.7em;
            margin-top: 5px;
            opacity: 0.7;
        }
        .end-message {
            text-align: center;
            padding: 10px;
            margin: 20px 0;
            background-color: #d3d3d3;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1em;
            color: #333;
        }
    </style>

            const messageTime = new Date(startTime.getTime() + index * 30 * 1000);
            const formattedTime = messageTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const messageClass = `message ${party === 'Akira' ? 'message-akira' : 'message-victim'}`;
            return React.createElement(
                'div',
                { className: messageClass },
                React.createElement('div', { className: 'sender' }, party),
                React.createElement('div', null, content),
                React.createElement('div', { className: 'timestamp' }, formattedTime)
            );
        };

        const App = () => {
            const [messages, setMessages] = React.useState([]);
            const [showEndMessage, setShowEndMessage] = React.useState(false);
            const bottomRef = React.useRef(null);

            React.useEffect(() => {
                let index = 0;
                const interval = setInterval(() => {
                    if (index < chatData.messages.length) {
                        setMessages(prev => [...prev, { ...chatData.messages[index], index }]);
                        index++;
                    } else {
                        setShowEndMessage(true);
                        clearInterval(interval);
                    }
                }, 3000); // Increased delay to 3 seconds for readability

                return () => clearInterval(interval);
            }, []);

            React.useEffect(() => {
                if (bottomRef.current) {
                    bottomRef.current.scrollIntoView({ behavior: 'smooth' });
                }
            }, [messages, showEndMessage]);

            return React.createElement(
                'div',
                null,
                messages.map((msg, idx) =>

                        party: msg.party,
                        content: msg.content,
